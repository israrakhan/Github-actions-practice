#what is lint:- Checks syntax , code spelling , indentations etc
# Goal : whenever someone changes the code . the linter will check if the syntax , format, indentation m is correct or not

name: Auto Linter
on: 
  push:
    paths: "*.py"

jobs:
  code-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/checkout@v7
        uses: actions/setup-python@v7
        with:
                  python-version: '3.14' # Specify your required version
         run: python --version
      - name: Install Linter
        run: pip install ruff
      - name: CHeck the files for linting
        run: ruff check .
      
        
      
